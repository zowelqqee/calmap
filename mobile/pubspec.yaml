name: calmap_mobile
description: Calmap — budget-aware nutrition planning for iOS and Android.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  http_parser: ^4.1.0
  flutter_secure_storage: ^10.3.1
  path_provider: ^2.1.6
  image_picker: ^1.2.3
  url_launcher: ^6.3.2
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0
  flutter_appauth: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/food/
    - assets/data/russia_cities.json
