# HAProxy on the server abroad: the fallback address of the API.
#
# Copy to /etc/haproxy/haproxy.cfg on the server abroad (RELEASE.md, «Запасной
# адрес API»). Ports 127.0.0.1:8443 and 127.0.0.1:8080 are the reverse tunnel of
# the edge container in Moscow (docker/egress/edge.sh). TLS passes through
# untouched and ends in Moscow; this server sees only encrypted bytes.
# Replace api2.calmap.ru if FALLBACK_DOMAIN differs.

global
	log /dev/log local0
	user haproxy
	group haproxy
	daemon
	maxconn 2000

defaults
	log global
	mode tcp
	option dontlognull
	timeout connect 5s
	# The AI consultant and photo recognition answer within 75 seconds.
	timeout client 2m
	timeout server 2m

frontend https
	bind :443
	tcp-request inspect-delay 5s
	tcp-request content accept if { req_ssl_hello_type 1 }
	# Only the fallback domain; anything else is closed.
	use_backend calmap_https if { req_ssl_sni -i api2.calmap.ru }

backend calmap_https
	# The PROXY header gives Caddy the user's address.
	server moscow 127.0.0.1:8443 send-proxy-v2

# Let's Encrypt validation of the fallback domain (HTTP-01) and redirects.
frontend http
	bind :80
	default_backend calmap_http

backend calmap_http
	server moscow 127.0.0.1:8080
