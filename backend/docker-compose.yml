services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-calmap}
      POSTGRES_USER: ${POSTGRES_USER:-calmap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      PORT: 8000
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      # Requests reach the backend only through Caddy inside this private network.
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      db:
        condition: service_healthy
    # Published on loopback only: the public entry point is Caddy (HTTPS). Set
    # BACKEND_BIND=0.0.0.0 only for a temporary check without a domain.
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    volumes:
      - media_data:/app/media
      - ../data:/data:ro

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    profiles: ["https"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env to use the https profile}
      BOT_ALLOWED_IPS: ${BOT_ALLOWED_IPS:-0.0.0.0/0 ::/0}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles: ["https", "backup"]
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-calmap}
      PGUSER: ${POSTGRES_USER:-calmap}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./docker/backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-../backups}:/backups
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
  caddy_data:
  caddy_config:
