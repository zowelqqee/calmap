name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI never needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements.lock
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install --constraint requirements.lock -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check app tests
      - name: Audit dependencies
        run: .venv/bin/pip-audit --requirement requirements.lock
      - name: Test
        run: .venv/bin/python -m pytest -q
        env:
          PGHOST: localhost

  bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGUSER: postgres
      PGHOST: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            bot/pyproject.toml
            bot/requirements.lock
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install --constraint requirements.lock -e ".[dev]"
      - name: Lint
        run: .venv/bin/ruff check calmap_bot tests
      - name: Audit dependencies
        run: .venv/bin/pip-audit --requirement requirements.lock
      - name: Test
        run: .venv/bin/python -m pytest -q

  backend-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker images
        run: |
          docker build -t calmap-backend backend
          docker build -t calmap-bot bot

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib/core lib/screens lib/main.dart test/local_first_test.dart
      - run: flutter analyze
      - run: flutter test
